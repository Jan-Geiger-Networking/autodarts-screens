name: Release

# Ein Tag der Form vX.Y.Z baut den Windows-Installer und haengt ihn samt
# Stueckliste an ein GitHub-Release. Der Tag-Name bestimmt die Version, nicht
# der Stand in package.json.
on:
  push:
    tags:
      - 'v*'

# So eng wie moeglich: nur Schreibrecht auf Repository-Inhalte, das braucht
# das Anlegen/Ergaenzen des Releases. Alle anderen Berechtigungen bleiben aus.
permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Electron-Binaerdownload pruefen
        # Der Postinstall-Schritt von Electron hat in diesem Projekt schon
        # einmal ohne Fehlermeldung keine funktionierende electron.exe
        # hinterlassen - "npm ci" war gruen, das Binary fehlte trotzdem.
        # "electron --version" startet die echte ausfuehrbare Datei kurz und
        # schlaegt hart fehl, wenn sie fehlt oder beschaedigt ist. Lieber
        # hier abbrechen als einen kaputten Installer weiterzubauen.
        run: npx electron --version

      - name: Version aus Tag uebernehmen
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_ENV"
          echo "Freigegebene Version: $version"

      - name: Tests
        run: npx vitest run

      - name: Typpruefung
        run: npm run typecheck

      - name: Anwendung bauen
        run: npm run build

      - name: Installer bauen
        run: npx electron-builder --win

      - name: Stueckliste erzeugen
        shell: bash
        run: npm sbom --sbom-format cyclonedx > "release/autodarts-screens-${version}.cdx.json"

      - name: Bauergebnis pruefen
        shell: bash
        run: |
          ls -l release/*.exe release/*.cdx.json
          test -s "release/Autodarts Dual-Screen Setup ${version}.exe"

      - name: An GitHub-Release haengen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.cdx.json
          fail_on_unmatched_files: true
