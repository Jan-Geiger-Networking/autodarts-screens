name: Release

# Ein Tag der Form vX.Y.Z baut den Windows-Installer und haengt ihn samt
# Stueckliste an ein GitHub-Release. Der Tag-Name bestimmt die Version, nicht
# der Stand in package.json.
on:
  push:
    tags:
      - 'v*'

# So eng wie moeglich: nur Schreibrecht auf Repository-Inhalte, das braucht
# das Anlegen/Ergaenzen des Releases. Alle anderen Berechtigungen bleiben aus.
permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Electron-Binaerdownload pruefen
        # Der Postinstall-Schritt von Electron hat in diesem Projekt schon
        # einmal ohne Fehlermeldung keine funktionierende electron.exe
        # hinterlassen - "npm ci" war gruen, das Binary fehlte trotzdem.
        # "electron --version" startet die echte ausfuehrbare Datei kurz und
        # schlaegt hart fehl, wenn sie fehlt oder beschaedigt ist. Lieber
        # hier abbrechen als einen kaputten Installer weiterzubauen.
        run: npx electron --version

      - name: Version aus Tag uebernehmen
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_ENV"
          echo "Freigegebene Version: $version"

      - name: Tests
        run: npx vitest run

      - name: Typpruefung
        run: npm run typecheck

      - name: Anwendung bauen
        run: npm run build

      - name: Installer bauen
        # --publish never: electron-builder erzeugt wegen der publish-Angabe in
        # package.json die Datei latest.yml (ohne sie findet electron-updater
        # nichts), laedt aber nichts selbst hoch - das Release baut der Schritt
        # weiter unten mit einer festen Aktion und einer engen Berechtigung.
        run: npx electron-builder --win --publish never

      - name: Stueckliste erzeugen
        shell: bash
        run: npm sbom --sbom-format cyclonedx > "release/autodarts-screens-${version}.cdx.json"

      - name: Bauergebnis pruefen
        shell: bash
        run: |
          ls -l release/*.exe release/*.cdx.json release/latest.yml
          # Dateiname ohne Leerzeichen (artifactName in package.json): GitHub
          # ersetzt Leerzeichen in Anhangsnamen durch Punkte, electron-updater
          # erwartet aber Bindestriche - mit Leerzeichen im Namen liefe jeder
          # Download der Selbstaktualisierung in einen 404.
          test -s "release/autodarts-screens-Setup-${version}.exe"
          # Ohne latest.yml findet die Selbstaktualisierung diese Version nie.
          test -s release/latest.yml
          grep -q "autodarts-screens-Setup-${version}.exe" release/latest.yml
          # Ohne die Blockmap laedt electron-updater bei jedem Update den
          # vollen Installer statt nur der geaenderten Bloecke und schreibt
          # jedes Mal einen 404 ins Protokoll.
          test -s "release/autodarts-screens-Setup-${version}.exe.blockmap"

      - name: An GitHub-Release haengen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/*.cdx.json
            release/latest.yml
          fail_on_unmatched_files: true
          # Jede Version mit Bindestrich ist nach Semantic Versioning eine
          # Vorabversion - 0.1.0-beta.1 ja, 0.1.0 nein. Ohne diese
          # Kennzeichnung zeigt GitHub eine Beta als "Latest release" an, und
          # Werkzeuge behandeln sie wie eine stabile Fassung.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Windows-Installer, **unsigniert**. Beim ersten Start meldet sich
            SmartScreen mit "Der Computer wurde durch Windows geschuetzt" -
            auf "Weitere Informationen" und dann "Trotzdem ausfuehren"
            klicken. Das kommt nur beim ersten Mal.

            Installiert pro Nutzer, ohne Administratorrecht.

            Was diese Version kann und was ihr fehlt, steht im Changelog.

            Die beigelegte Datei mit der Endung `.cdx.json` ist die
            Stueckliste aller enthaltenen Komponenten im CycloneDX-Format.
